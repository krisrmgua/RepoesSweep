<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repoes Sweep</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand-wrap" id="brand">
          <img id="mark" class="mark hidden" alt="" />
          <span class="brand">Repoes Sweep</span>
        </div>
        <button type="button" id="back" class="back hidden">
          <span class="chev-left" aria-hidden="true"></span>
          Preferences
        </button>
        <div class="top-actions">
          <span id="spinner" class="spinner hidden" aria-label="Scanning"></span>
          <button type="button" id="refresh" class="icon-btn" title="Refresh">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" />
              <path d="M13.5 2.5v3h-3" />
            </svg>
          </button>
          <button type="button" id="gear" class="icon-btn" title="Preferences">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="8" cy="8" r="2.2" />
              <path
                d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"
              />
            </svg>
          </button>
        </div>
      </header>

      <main id="content"></main>

      <footer class="foot">
        <span id="app-version" class="ver"></span>
        <span id="updated">Scanning clones…</span>
        <span class="spacer"></span>
        <span id="count"></span>
        <button type="button" id="quit" class="link">Quit</button>
      </footer>
    </div>

    <div id="confirm" class="confirm hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="confirm-card">
        <h2 id="confirm-title">Confirm</h2>
        <p id="confirm-message"></p>
        <div class="confirm-actions">
          <button type="button" class="ghost" id="confirm-cancel">Cancel</button>
          <button type="button" class="primary" id="confirm-ok">Confirm</button>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
